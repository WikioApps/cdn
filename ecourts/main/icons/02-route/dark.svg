    <linearGradient id="field" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse"><stop stop-color="#241c1d"/><stop offset="1" stop-color="#171619"/></linearGradient>
    <linearGradient id="body" x1="221" y1="280" x2="805" y2="787" gradientUnits="userSpaceOnUse"><stop stop-color="#ffa57f"/><stop offset=".54" stop-color="#f7835f"/><stop offset="1" stop-color="#d96751"/></linearGradient>
    <radialGradient id="terminal" cx="30%" cy="18%" r="89%"><stop stop-color="#ffe0b8"/><stop offset=".45" stop-color="#ffa377"/><stop offset="1" stop-color="#e5785e"/></radialGradient>
    <linearGradient id="edge-light" x1="200" y1="280" x2="790" y2="815" gradientUnits="userSpaceOnUse"><stop stop-color="#fff2dd" stop-opacity=".7"/><stop offset=".5" stop-color="#fff2dd" stop-opacity=".18"/><stop offset="1" stop-color="#fff2dd" stop-opacity="0"/></linearGradient>
    <filter id="lift" x="-.4" y="-.3" width="1.8" height="1.8" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="16"/></filter>
