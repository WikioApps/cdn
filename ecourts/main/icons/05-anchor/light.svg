<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
<title id="title">eCourts · Anchor · Light</title>
<desc id="description">Two broad opposing chevrons interlock through alternating crossings. Carefully cut edges surround a clear diamond opening; teal and warm brass remain distinct against a complete light background.</desc>
