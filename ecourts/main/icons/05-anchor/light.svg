    <linearGradient id="rightRim" x1="541" y1="272" x2="680" y2="710" gradientUnits="userSpaceOnUse"><stop stop-color="#FBE4B7"/><stop offset=".6" stop-color="#D5A663"/><stop offset="1" stop-color="#694923"/></linearGradient>
    <linearGradient id="underpass" x1="483" y1="656" x2="542" y2="714" gradientUnits="userSpaceOnUse"><stop stop-color="#25383B" stop-opacity=".65"/><stop offset="1" stop-color="#25383B" stop-opacity="0"/></linearGradient>
    <linearGradient id="topShadow" x1="468" y1="370" x2="438" y2="405" gradientUnits="userSpaceOnUse"><stop stop-color="#25383B" stop-opacity=".55"/><stop offset="1" stop-color="#25383B" stop-opacity="0"/></linearGradient>
    <filter id="lift" x="-.15" y="-.15" width="1.3" height="1.35" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/><feOffset in="blur" dy="9" result="offset"/><feFlood flood-color="#25383B" flood-opacity=".12" result="color"/><feComposite in="color" in2="offset" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g id="background"><path d="M0 0H1024V1024H0Z" fill="#F3F0E8"/></g>
<g id="symbol" transform="translate(512 512) scale(1.1) translate(-512 -512)" filter="url(#lift)">
