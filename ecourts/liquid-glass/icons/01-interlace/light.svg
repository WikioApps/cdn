    <linearGradient id="reflection" x1="350" y1="210" x2="660" y2="730" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".85"/><stop offset=".3" stop-color="#FFFFFF" stop-opacity=".2"/><stop offset=".52" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".81" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".42"/></linearGradient>
    <linearGradient id="fold-shadow" x1="430" y1="381" x2="486" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#103D63" stop-opacity=".76"/><stop offset="1" stop-color="#103D63" stop-opacity="0"/></linearGradient>
