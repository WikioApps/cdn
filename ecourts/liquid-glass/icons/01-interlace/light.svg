<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">eCourts · Interlace · light</title>
  <desc id="desc">Two broad folded glass ribbons join into a single connected mark. The open diagonal passages, quiet backplate and contrasting spectral edges are designed for small application launchers. Original native vector artwork; paired light and dark editions use identical geometry.</desc>
