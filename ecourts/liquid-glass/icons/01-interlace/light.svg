    <linearGradient id="a-body" x1="299" y1="258" x2="720" y2="735" gradientUnits="userSpaceOnUse"><stop stop-color="#EDFFFF"/><stop offset=".24" stop-color="#8CEDEF"/><stop offset=".62" stop-color="#23B8CE"/><stop offset="1" stop-color="#126899"/></linearGradient>
    <linearGradient id="b-body" x1="293" y1="299" x2="700" y2="749" gradientUnits="userSpaceOnUse"><stop stop-color="#F1E8FF"/><stop offset=".32" stop-color="#BFADFF"/><stop offset=".74" stop-color="#7960DA"/><stop offset="1" stop-color="#362C82"/></linearGradient>
    <linearGradient id="a-edge" x1="250" y1="280" x2="790" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".25" stop-color="#23B8CE"/><stop offset=".48" stop-color="#EDFFFF"/><stop offset=".74" stop-color="#126899"/><stop offset="1" stop-color="#103D63"/></linearGradient>
