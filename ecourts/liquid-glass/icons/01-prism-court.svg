    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#b9fff8" stop-opacity=".9"/><stop offset=".56" stop-color="#4db0ce" stop-opacity=".25"/><stop offset=".79" stop-color="#7fede3"/><stop offset="1" stop-color="#dcffff"/></linearGradient>
    <linearGradient id="pillar" x1="0" x2="1"><stop stop-color="#60cdd3" stop-opacity=".65"/><stop offset=".19" stop-color="#edfffb" stop-opacity=".92"/><stop offset=".3" stop-color="#8ee8e1" stop-opacity=".5"/><stop offset=".69" stop-color="#28a7bd" stop-opacity=".34"/><stop offset=".85" stop-color="#75ddde" stop-opacity=".7"/><stop offset="1" stop-color="#d3fff4" stop-opacity=".9"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#d3fff3" stop-opacity=".95"/><stop offset=".12" stop-color="#54c9cb" stop-opacity=".85"/><stop offset=".47" stop-color="#1b829c" stop-opacity=".75"/><stop offset="1" stop-color="#36b4b8" stop-opacity=".65"/></linearGradient>
