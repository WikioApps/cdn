<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">eCourts · Prism Court</title>
  <desc id="desc">An architectural glass arch with three fluted columns and a stepped foundation, in aquamarine on midnight blue.</desc>
  <defs>
