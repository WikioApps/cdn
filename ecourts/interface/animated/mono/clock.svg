<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Clock" class="ecui-clock-mono-motion">
<title>Clock</title>
<desc>The minute hand advances through a small interval and settles.</desc>
<style>@media(prefers-reduced-motion:no-preference){.ecui-clock-mono-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-clock-mono-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-clock-mono-motion-p1{0%{transform:rotate(-20deg)}26%{transform:rotate(-10deg)}58%{transform:rotate(2deg)}82%{transform:rotate(0.3deg)}100%{transform:rotate(0deg)}}}</style>
<path class="p0" d="M3.5 12a8.5 8.5 0 1 0 17 0a8.5 8.5 0 1 0 -17 0Z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path class="p1" d="M12 6.5V12L16 14" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
