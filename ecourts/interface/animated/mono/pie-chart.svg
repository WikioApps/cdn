<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Pie chart" class="ecui-pie-chart-mono-motion">
<title>Pie chart</title>
<desc>The separate sector seats in the chart.</desc>
<style>@media(prefers-reduced-motion:no-preference){.ecui-pie-chart-mono-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-pie-chart-mono-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-pie-chart-mono-motion-p1{0%{transform:translateX(1.2px)}26%{transform:translateX(0.7px)}58%{transform:translateX(-0.05px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
