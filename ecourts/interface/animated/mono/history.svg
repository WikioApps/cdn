<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="History" class="ecui-history-mono-motion">
<title>History</title>
<desc>The time hand returns along a brief past interval.</desc>
<style>@media(prefers-reduced-motion:no-preference){.ecui-history-mono-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-history-mono-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-history-mono-motion-p1{0%{transform:rotate(20deg)}26%{transform:rotate(10deg)}58%{transform:rotate(-2deg)}82%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}}</style>
