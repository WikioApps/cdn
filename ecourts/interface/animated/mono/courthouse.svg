<style>@media(prefers-reduced-motion:no-preference){.ecui-courthouse-mono-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-courthouse-mono-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-courthouse-mono-motion-p2{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}.ecui-courthouse-mono-motion .p3{transform-box:view-box;transform-origin:12px 12px;animation:ecui-courthouse-mono-motion-p3 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-courthouse-mono-motion-p3{0%{transform:translateY(-2.1px)}26%{transform:translateY(-2.1px)}58%{transform:translateY(-0.4px)}82%{transform:translateY(0.12px)}100%{transform:translateY(0px)}}.ecui-courthouse-mono-motion .p4{transform-box:view-box;transform-origin:12px 12px;animation:ecui-courthouse-mono-motion-p4 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-courthouse-mono-motion-p4{0%{transform:translateY(-2.1px)}26%{transform:translateY(-2.1px)}58%{transform:translateY(-1.2px)}82%{transform:translateY(0.12px)}100%{transform:translateY(0px)}}}</style>
