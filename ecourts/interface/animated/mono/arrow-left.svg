<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Back" class="ecui-arrow-left-mono-motion">
<title>Back</title>
<desc>The arrowhead leads a small return movement.</desc>
<style>@media(prefers-reduced-motion:no-preference){.ecui-arrow-left-mono-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-arrow-left-mono-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-arrow-left-mono-motion-p1{0%{transform:translateX(1px)}26%{transform:translateX(0.5px)}58%{transform:translateX(-0.5px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
