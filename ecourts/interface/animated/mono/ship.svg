<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Ship" class="ecui-ship-mono-motion">
<title>Ship</title>
<desc>The hull moves through one short swell.</desc>
