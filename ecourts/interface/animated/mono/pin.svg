<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Place" class="ecui-pin-mono-motion">
<title>Place</title>
<desc>The location pin seats on its map point.</desc>
<style>@media(prefers-reduced-motion:no-preference){.ecui-pin-mono-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-pin-mono-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-pin-mono-motion-p1{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}.ecui-pin-mono-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-pin-mono-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-pin-mono-motion-p2{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
