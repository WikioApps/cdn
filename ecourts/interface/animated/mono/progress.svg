<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Progress" class="ecui-progress-mono-motion">
<title>Progress</title>
<desc>The advancing fill travels along a fixed progress track.</desc>
<style>@media(prefers-reduced-motion:no-preference){.ecui-progress-mono-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-progress-mono-motion-p1 1200ms cubic-bezier(.3,0,.2,1) infinite backwards}@keyframes ecui-progress-mono-motion-p1{0%{transform:translateX(0px)}40%{transform:translateX(7px)}70%{transform:translateX(7px)}100%{transform:translateX(0px)}}}</style>
<path class="p0" d="M3.5 12H20.5" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path class="p1" d="M5 12H11" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
