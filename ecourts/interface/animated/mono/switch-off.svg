<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Switch off" class="ecui-switch-off-mono-motion">
<title>Switch off</title>
<desc>The thumb travels to its resting state without moving the track.</desc>
<style>@media(prefers-reduced-motion:no-preference){.ecui-switch-off-mono-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-switch-off-mono-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-switch-off-mono-motion-p1{0%{transform:translateX(5px)}26%{transform:translateX(2.5px)}58%{transform:translateX(-0.1px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
