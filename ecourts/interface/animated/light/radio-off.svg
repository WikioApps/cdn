<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Available option" class="ecui-radio-off-light-motion">
<title>Available option</title>
<desc>The option boundary resolves.</desc>
<defs><linearGradient id="ecui-radio-off-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-radio-off-light-motion .p0{stroke-dasharray:1;stroke-dashoffset:0;transform-box:view-box;transform-origin:12px 12px;animation:ecui-radio-off-light-motion-p0 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-radio-off-light-motion-p0{0%{stroke-dashoffset:1}15%{stroke-dashoffset:1}80%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}}</style>
