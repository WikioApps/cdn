<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Paintbrush" class="ecui-paintbrush-light-motion">
<title>Paintbrush</title>
<desc>The brush draws a short finishing stroke.</desc>
<defs><linearGradient id="ecui-paintbrush-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-paintbrush-light-motion .p0{transform-box:view-box;transform-origin:12px 12px;animation:ecui-paintbrush-light-motion-p0 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-paintbrush-light-motion-p0{0%{transform:translateX(-1.3px)}26%{transform:translateX(-0.8px)}58%{transform:translateX(0.7px)}82%{transform:translateX(0.15px)}100%{transform:translateX(0px)}}}</style>
