<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Expand" class="ecui-chevron-down-light-motion">
<title>Expand</title>
<desc>The directional stroke leads a short movement and returns.</desc>
<defs><linearGradient id="ecui-chevron-down-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-chevron-down-light-motion .p0{transform-box:view-box;transform-origin:12px 12px;animation:ecui-chevron-down-light-motion-p0 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-chevron-down-light-motion-p0{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M5.5 9L12 15.5L18.5 9" fill="none" stroke="url(#ecui-chevron-down-light-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
