<path class="p1" d="M6.5 18Q2.5 18 2.5 14Q2.5 10 7 10Q7 3 13 4Q18 4 18.5 10Q22 10.5 21.5 14.5Q21 18 17.5 18Z" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke:var(--ec-icon-ink,#482F36)"/>
