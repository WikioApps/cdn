<style>@media(prefers-reduced-motion:no-preference){.ecui-star-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-star-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-star-light-motion-p1{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
