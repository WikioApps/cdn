<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Star" class="ecui-star-light-motion">
<title>Star</title>
<desc>The upper point resolves while the star outline remains recognizable.</desc>
