<path class="p2" d="M7.8 6H16.2Q17 6 17 6.8V11.2Q17 12 16.2 12H7.8Q7 12 7 11.2V6.8Q7 6 7.8 6Z" fill="url(#ecui-bus-light-motion-accent)"/>
