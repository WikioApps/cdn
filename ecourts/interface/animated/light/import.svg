<style>@media(prefers-reduced-motion:no-preference){.ecui-import-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-import-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-import-light-motion-p1{0%{transform:translateX(-1px)}26%{transform:translateX(-0.5px)}58%{transform:translateX(0.5px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
