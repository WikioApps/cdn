<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Import" class="ecui-import-light-motion">
<title>Import</title>
<desc>An incoming arrow enters the open file boundary.</desc>
