<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="FIR search" class="ecui-fir-search-light-motion">
<title>FIR search</title>
<desc>The search lens scans beside the anchored FIR shield.</desc>
<defs><linearGradient id="ecui-fir-search-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-fir-search-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-fir-search-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-fir-search-light-motion-p1{0%{transform:translateX(0px)}26%{transform:translateX(-1.1px)}58%{transform:translateX(1.1px)}82%{transform:translateX(-0.15px)}100%{transform:translateX(0px)}}.ecui-fir-search-light-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-fir-search-light-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-fir-search-light-motion-p2{0%{transform:translateX(0px)}26%{transform:translateX(-1.1px)}58%{transform:translateX(1.1px)}82%{transform:translateX(-0.15px)}100%{transform:translateX(0px)}}}</style>
<path class="p0" d="M11 3.5L18 6V10M11 3.5L4 6V11Q4 17 11 20" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M10.5 14a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0 -9 0Z" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p2" d="M18 17L21 20L19.5 21.5L16.5 18.5Z" fill="url(#ecui-fir-search-light-motion-accent)"/>
</svg>
