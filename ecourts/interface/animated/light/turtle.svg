<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Turtle" class="ecui-turtle-light-motion">
<title>Turtle</title>
<desc>The head extends beyond a fixed shell.</desc>
<defs><linearGradient id="ecui-turtle-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-turtle-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-turtle-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-turtle-light-motion-p1{0%{transform:translateX(-1.2px)}26%{transform:translateX(-0.6px)}58%{transform:translateX(0.1px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
