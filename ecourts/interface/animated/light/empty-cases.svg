<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="No saved cases" class="ecui-empty-cases-light-motion">
<title>No saved cases</title>
<desc>The empty filing line is drawn in the open case.</desc>
