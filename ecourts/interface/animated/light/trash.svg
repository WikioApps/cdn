<style>@media(prefers-reduced-motion:no-preference){.ecui-trash-light-motion .p1{transform-box:view-box;transform-origin:5px 6px;animation:ecui-trash-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-trash-light-motion-p1{0%{transform:rotate(-10deg)}26%{transform:rotate(-5deg)}58%{transform:rotate(1deg)}82%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}}</style>
