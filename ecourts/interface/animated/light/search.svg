<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Search" class="ecui-search-light-motion">
<title>Search</title>
<desc>The lens inspects a short horizontal range, then returns to centre.</desc>
<defs><linearGradient id="ecui-search-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-search-light-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-search-light-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-search-light-motion-p2{0%{transform:translateX(0px)}26%{transform:translateX(-1.1px)}58%{transform:translateX(1.1px)}82%{transform:translateX(-0.15px)}100%{transform:translateX(0px)}}.ecui-search-light-motion .p3{transform-box:view-box;transform-origin:12px 12px;animation:ecui-search-light-motion-p3 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-search-light-motion-p3{0%{transform:translateX(0px)}26%{transform:translateX(-1.1px)}58%{transform:translateX(1.1px)}82%{transform:translateX(-0.15px)}100%{transform:translateX(0px)}}}</style>
<path class="p0" d="M15.7 15.7L20.5 20.5" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M3.8 10.2a6.4 6.4 0 1 0 12.8 0a6.4 6.4 0 1 0 -12.8 0Z" fill="#E9543E" opacity="0.12" style="fill:var(--ec-icon-soft,#E9543E)"/>
<path class="p2" d="M3.8 10.2a6.4 6.4 0 1 0 12.8 0a6.4 6.4 0 1 0 -12.8 0Z" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p3" d="M7.3 9.3Q7.8 7.1 10.2 7.1" fill="none" stroke="url(#ecui-search-light-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
