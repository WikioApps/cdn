<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Phone" class="ecui-phone-light-motion">
<title>Phone</title>
<desc>The receiver inclines once from its lower end.</desc>
<defs><linearGradient id="ecui-phone-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-phone-light-motion .p0{transform-box:view-box;transform-origin:18px 18px;animation:ecui-phone-light-motion-p0 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-phone-light-motion-p0{0%{transform:rotate(-7deg)}26%{transform:rotate(-3deg)}58%{transform:rotate(1deg)}82%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}}</style>
<path class="p0" d="M4 3.5H8L10 8L7.5 10Q9.5 15 14 16.5L16 14L20.5 16V20Q13 23 7 17Q1 11 4 3.5Z" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M4 3.5H8L10 8L6 9Z" fill="url(#ecui-phone-light-motion-accent)"/>
</svg>
