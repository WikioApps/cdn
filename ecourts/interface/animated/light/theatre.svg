<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Theatre" class="ecui-theatre-light-motion">
<title>Theatre</title>
<desc>The theatrical mask inclines from its top edge.</desc>
<defs><linearGradient id="ecui-theatre-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-theatre-light-motion .p0{transform-box:view-box;transform-origin:12px 6px;animation:ecui-theatre-light-motion-p0 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-theatre-light-motion-p0{0%{transform:rotate(-5deg)}26%{transform:rotate(-3deg)}58%{transform:rotate(0.8deg)}82%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}}</style>
