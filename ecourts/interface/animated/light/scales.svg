<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Scales" class="ecui-scales-light-motion">
<title>Scales</title>
<desc>The beam balances once about its central pin.</desc>
<defs><linearGradient id="ecui-scales-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-scales-light-motion .p1{transform-box:view-box;transform-origin:12px 7px;animation:ecui-scales-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-scales-light-motion-p1{0%{transform:rotate(-7deg)}26%{transform:rotate(-3deg)}58%{transform:rotate(2deg)}82%{transform:rotate(-0.4deg)}100%{transform:rotate(0deg)}}}</style>
<path class="p0" d="M12 4V20M8.5 20H15.5" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
