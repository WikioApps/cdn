<style>@media(prefers-reduced-motion:no-preference){.ecui-flame-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-flame-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-flame-light-motion-p1{0%{transform:translateY(1.8px)}26%{transform:translateY(1px)}58%{transform:translateY(-0.1px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
