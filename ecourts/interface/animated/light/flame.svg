<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Flame" class="ecui-flame-light-motion">
<title>Flame</title>
<desc>The inner flame rises within the stable outer silhouette.</desc>
