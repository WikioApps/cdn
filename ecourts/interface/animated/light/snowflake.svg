<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Snowflake" class="ecui-snowflake-light-motion">
<title>Snowflake</title>
<desc>The crystalline branches are traced from the centre.</desc>
