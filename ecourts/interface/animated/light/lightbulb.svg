<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Lightbulb" class="ecui-lightbulb-light-motion">
<title>Lightbulb</title>
<desc>The filament is traced inside the steady bulb.</desc>
