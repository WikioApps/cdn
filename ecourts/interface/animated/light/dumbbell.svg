<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Training" class="ecui-dumbbell-light-motion">
<title>Training</title>
<desc>The grip lifts a short controlled interval between the plates.</desc>
<defs><linearGradient id="ecui-dumbbell-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-dumbbell-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-dumbbell-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-dumbbell-light-motion-p1{0%{transform:translateY(1.2px)}26%{transform:translateY(0.2px)}58%{transform:translateY(-0.4px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M4 8V16M7 5V19M17 5V19M20 8V16" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M9 10.5H15Q16 10.5 16 11.5V12.5Q16 13.5 15 13.5H9Q8 13.5 8 12.5V11.5Q8 10.5 9 10.5Z" fill="url(#ecui-dumbbell-light-motion-accent)"/>
</svg>
