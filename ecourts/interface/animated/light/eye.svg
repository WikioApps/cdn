<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Visible" class="ecui-eye-light-motion">
<title>Visible</title>
<desc>The pupil checks left and right while the eyelid remains still.</desc>
<defs><linearGradient id="ecui-eye-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-eye-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-eye-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-eye-light-motion-p1{0%{transform:translateX(0px)}26%{transform:translateX(-1.1px)}58%{transform:translateX(1.1px)}82%{transform:translateX(-0.15px)}100%{transform:translateX(0px)}}}</style>
<path class="p0" d="M3 12Q7 5.5 12 5.5Q17 5.5 21 12Q17 18.5 12 18.5Q7 18.5 3 12Z" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0Z" fill="url(#ecui-eye-light-motion-accent)"/>
</svg>
