<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="No search results" class="ecui-empty-search-light-motion">
<title>No search results</title>
<desc>The empty result bar appears inside the fixed lens.</desc>
