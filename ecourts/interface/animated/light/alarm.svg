<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Alarm" class="ecui-alarm-light-motion">
<title>Alarm</title>
<desc>The paired alarm bells rock once on their mounts.</desc>
<defs><linearGradient id="ecui-alarm-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-alarm-light-motion .p2{transform-box:view-box;transform-origin:6px 6px;animation:ecui-alarm-light-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-alarm-light-motion-p2{0%{transform:rotate(-9deg)}26%{transform:rotate(6deg)}58%{transform:rotate(-2.5deg)}82%{transform:rotate(0.6deg)}100%{transform:rotate(0deg)}}.ecui-alarm-light-motion .p3{transform-box:view-box;transform-origin:18px 6px;animation:ecui-alarm-light-motion-p3 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-alarm-light-motion-p3{0%{transform:rotate(0deg)}26%{transform:rotate(-8deg)}58%{transform:rotate(4deg)}82%{transform:rotate(-1deg)}100%{transform:rotate(0deg)}}}</style>
