<path class="p1" d="M12 20Q3.5 14 3.5 8.5Q3.5 4 7.5 4Q10.5 4 12 7Q13.5 4 16.5 4Q20.5 4 20.5 8.5Q20.5 14 12 20Z" fill="none" stroke="url(#ecui-heart-light-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
