<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Notifications" class="ecui-bell-light-motion">
<title>Notifications</title>
<desc>The bell swings about its crown and returns to rest.</desc>
<defs><linearGradient id="ecui-bell-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-bell-light-motion .p1{transform-box:view-box;transform-origin:12px 5px;animation:ecui-bell-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-bell-light-motion-p1{0%{transform:rotate(-9deg)}26%{transform:rotate(6deg)}58%{transform:rotate(-2.5deg)}82%{transform:rotate(0.6deg)}100%{transform:rotate(0deg)}}}</style>
<path class="p0" d="M9.5 20Q12 22 14.5 20" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M5 17L7 13V9Q7 4 12 4Q17 4 17 9V13L19 17Z" fill="url(#ecui-bell-light-motion-accent)"/>
<path class="p2" d="M12 2.5V4" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
</svg>
