<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Pie chart" class="ecui-pie-chart-light-motion">
<title>Pie chart</title>
<desc>The separate sector seats in the chart.</desc>
<defs><linearGradient id="ecui-pie-chart-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-pie-chart-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-pie-chart-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-pie-chart-light-motion-p1{0%{transform:translateX(1.2px)}26%{transform:translateX(0.7px)}58%{transform:translateX(-0.05px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
<path class="p0" d="M10 4A8.5 8.5 0 1 0 20 14H10Z" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M13 3V11H21A8 8 0 0 0 13 3Z" fill="url(#ecui-pie-chart-light-motion-accent)"/>
</svg>
