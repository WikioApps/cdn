<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Download" class="ecui-download-light-motion">
<title>Download</title>
<desc>The arrow moves into the tray.</desc>
<defs><linearGradient id="ecui-download-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-download-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-download-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-download-light-motion-p1{0%{transform:translateY(-2px)}26%{transform:translateY(-1px)}58%{transform:translateY(0.2px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M4 14V19Q4 20 5 20H19Q20 20 20 19V14" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M12 3V15M7.5 10.5L12 15L16.5 10.5" fill="none" stroke="url(#ecui-download-light-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
