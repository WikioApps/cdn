<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Ship" class="ecui-ship-light-motion">
<title>Ship</title>
<desc>The hull moves through one short swell.</desc>
<defs><linearGradient id="ecui-ship-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-ship-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-ship-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-ship-light-motion-p1{0%{transform:translateY(0px)}26%{transform:translateY(-0.5px)}58%{transform:translateY(0.5px)}82%{transform:translateY(0.1px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M7 11V6H17V11M10 6V3.5H14V6M3 21Q6 18 9 21T15 21T21 21" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M3 13L12 10L21 13L18 18H6Z" fill="url(#ecui-ship-light-motion-accent)"/>
</svg>
