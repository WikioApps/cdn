<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Eclipse" class="ecui-eclipse-light-motion">
<title>Eclipse</title>
<desc>The obscured disc reveals its remaining crescent.</desc>
<defs><linearGradient id="ecui-eclipse-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-eclipse-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-eclipse-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-eclipse-light-motion-p1{0%{transform:scaleX(0.68)}26%{transform:scaleX(0.75)}58%{transform:scaleX(1.02)}82%{transform:scaleX(1)}100%{transform:scaleX(1)}}}</style>
