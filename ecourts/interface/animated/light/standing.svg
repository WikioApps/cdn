<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Standing person" class="ecui-standing-light-motion">
<title>Standing person</title>
<desc>The torso rises into a composed standing position.</desc>
<defs><linearGradient id="ecui-standing-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-standing-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-standing-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-standing-light-motion-p1{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M10 4.5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0Z" fill="url(#ecui-standing-light-motion-accent)"/>
<path class="p1" d="M7 10L12 8.5L17 10M12 9V14M8.5 21L12 14L15.5 21" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
</svg>
