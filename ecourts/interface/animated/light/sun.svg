<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Light theme" class="ecui-sun-light-motion">
<title>Light theme</title>
<desc>The rays extend around a stable warm disc.</desc>
