<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Needs attention" class="ecui-warning-light-motion">
<title>Needs attention</title>
<desc>The attention mark extends inside a fixed warning outline.</desc>
<defs><linearGradient id="ecui-warning-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-warning-light-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-warning-light-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-warning-light-motion-p2{0%{transform:scaleY(0.65)}26%{transform:scaleY(0.8)}58%{transform:scaleY(1.02)}82%{transform:scaleY(1)}100%{transform:scaleY(1)}}}</style>
