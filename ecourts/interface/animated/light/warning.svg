<path class="p2" d="M12 9V13.5" fill="none" stroke="url(#ecui-warning-light-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path class="p3" d="M11.2 17a0.8 0.8 0 1 0 1.6 0a0.8 0.8 0 1 0 -1.6 0Z" fill="url(#ecui-warning-light-motion-accent)"/>
