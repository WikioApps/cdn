<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Back" class="ecui-arrow-left-light-motion">
<title>Back</title>
<desc>The arrowhead leads a small return movement.</desc>
<defs><linearGradient id="ecui-arrow-left-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-arrow-left-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-arrow-left-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-arrow-left-light-motion-p1{0%{transform:translateX(1px)}26%{transform:translateX(0.5px)}58%{transform:translateX(-0.5px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
<path class="p0" d="M5 12H20" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M10.5 5.5L4 12L10.5 18.5" fill="none" stroke="url(#ecui-arrow-left-light-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
