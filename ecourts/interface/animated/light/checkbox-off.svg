<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Unselected" class="ecui-checkbox-off-light-motion">
<title>Unselected</title>
<desc>The selection boundary is drawn once.</desc>
<defs><linearGradient id="ecui-checkbox-off-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-checkbox-off-light-motion .p0{stroke-dasharray:1;stroke-dashoffset:0;transform-box:view-box;transform-origin:12px 12px;animation:ecui-checkbox-off-light-motion-p0 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-checkbox-off-light-motion-p0{0%{stroke-dashoffset:1}15%{stroke-dashoffset:1}80%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}.ecui-checkbox-off-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-checkbox-off-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-checkbox-off-light-motion-p1{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M7 4H17Q20 4 20 7V17Q20 20 17 20H7Q4 20 4 17V7Q4 4 7 4Z" fill="none" stroke="#482F36" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke:var(--ec-icon-ink,#482F36)"/>
<path class="p1" d="M5 5H9V6H6V9H5Z" fill="url(#ecui-checkbox-off-light-motion-accent)"/>
