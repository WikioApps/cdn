<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Compass" class="ecui-compass-light-motion">
<title>Compass</title>
<desc>The needle finds north and settles.</desc>
<defs><linearGradient id="ecui-compass-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-compass-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-compass-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-compass-light-motion-p1{0%{transform:rotate(-7deg)}26%{transform:rotate(-3deg)}58%{transform:rotate(2deg)}82%{transform:rotate(-0.4deg)}100%{transform:rotate(0deg)}}}</style>
