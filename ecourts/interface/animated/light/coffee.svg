<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Coffee" class="ecui-coffee-light-motion">
<title>Coffee</title>
<desc>The steam rises above a fixed cup.</desc>
<defs><linearGradient id="ecui-coffee-light-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#E9543E" style="stop-color:var(--ec-icon-accent,#E9543E)"/><stop offset="1" stop-color="#C93639" style="stop-color:var(--ec-icon-accent-end,#C93639)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-coffee-light-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-coffee-light-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-coffee-light-motion-p1{0%{transform:translateY(1.8px)}26%{transform:translateY(1px)}58%{transform:translateY(-0.1px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
