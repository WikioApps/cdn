<path class="p1" d="M8 6Q6 4 8 2M12 6Q10 4 12 2" fill="none" stroke="url(#ecui-coffee-light-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
