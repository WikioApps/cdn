<style>@media(prefers-reduced-motion:no-preference){.ecui-tree-dark-motion .p1{transform-box:view-box;transform-origin:12px 16px;animation:ecui-tree-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-tree-dark-motion-p1{0%{transform:scaleY(0.7)}26%{transform:scaleY(0.85)}58%{transform:scaleY(1.02)}82%{transform:scaleY(1)}100%{transform:scaleY(1)}}}</style>
