<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Tree" class="ecui-tree-dark-motion">
<title>Tree</title>
<desc>The canopy opens above the rooted trunk.</desc>
