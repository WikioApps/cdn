<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Headphones" class="ecui-headphones-dark-motion">
<title>Headphones</title>
<desc>The ear pad adjusts inward beneath the headband.</desc>
