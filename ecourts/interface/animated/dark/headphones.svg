<style>@media(prefers-reduced-motion:no-preference){.ecui-headphones-dark-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-headphones-dark-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-headphones-dark-motion-p2{0%{transform:translateX(1.4px)}26%{transform:translateX(0.8px)}58%{transform:translateX(-0.08px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
