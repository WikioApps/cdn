<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Court transfer" class="ecui-transfer-dark-motion">
<title>Court transfer</title>
<desc>The second transfer arrow follows the first.</desc>
<defs><linearGradient id="ecui-transfer-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-transfer-dark-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-transfer-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-transfer-dark-motion-p1{0%{transform:translateX(1px)}26%{transform:translateX(0.5px)}58%{transform:translateX(-0.5px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
<path class="p0" d="M3 8H19M15 4L19 8L15 12" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p1" d="M21 16H5M9 12L5 16L9 20" fill="none" stroke="url(#ecui-transfer-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
