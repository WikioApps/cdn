<style>@media(prefers-reduced-motion:no-preference){.ecui-accessibility-dark-motion .p2{transform-box:view-box;transform-origin:12px 10px;animation:ecui-accessibility-dark-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-accessibility-dark-motion-p2{0%{transform:scaleY(0.65)}26%{transform:scaleY(0.8)}58%{transform:scaleY(1.02)}82%{transform:scaleY(1)}100%{transform:scaleY(1)}}}</style>
