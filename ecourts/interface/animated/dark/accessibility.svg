<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Accessibility" class="ecui-accessibility-dark-motion">
<title>Accessibility</title>
<desc>The open arms extend around a stable centre.</desc>
