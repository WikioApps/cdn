<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Calendar" class="ecui-calendar-dark-motion">
<title>Calendar</title>
<desc>The date tile turns into its selected position.</desc>
<defs><linearGradient id="ecui-calendar-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-calendar-dark-motion .p3{transform-box:view-box;transform-origin:16px 13px;animation:ecui-calendar-dark-motion-p3 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-calendar-dark-motion-p3{0%{transform:scaleX(0.55)}26%{transform:scaleX(0.72)}58%{transform:scaleX(1.02)}82%{transform:scaleX(1)}100%{transform:scaleX(1)}}}</style>
