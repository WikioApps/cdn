<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Place" class="ecui-pin-dark-motion">
<title>Place</title>
<desc>The location pin seats on its map point.</desc>
<defs><linearGradient id="ecui-pin-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-pin-dark-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-pin-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-pin-dark-motion-p1{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}.ecui-pin-dark-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-pin-dark-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-pin-dark-motion-p2{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M8 21H16" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p1" d="M12 19Q4.5 12 5 8Q5.5 3 12 3Q18.5 3 19 8Q19.5 12 12 19Z" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p2" d="M9.5 9a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z" fill="url(#ecui-pin-dark-motion-accent)"/>
</svg>
