<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Train" class="ecui-train-dark-motion">
<title>Train</title>
<desc>The train front seats above the rails.</desc>
<defs><linearGradient id="ecui-train-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-train-dark-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-train-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-train-dark-motion-p1{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M8 19L5 22M16 19L19 22" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p1" d="M8 3H16Q19 3 19 6V16Q19 19 16 19H8Q5 19 5 16V6Q5 3 8 3Z" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p2" d="M9 6H15Q16 6 16 7V11Q16 12 15 12H9Q8 12 8 11V7Q8 6 9 6Z" fill="url(#ecui-train-dark-motion-accent)"/>
<path class="p3" d="M8 16H8.1M16 16H16.1" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
</svg>
