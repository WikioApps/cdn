<path class="p1" d="M4.7 4H19.3Q20.5 4 20.5 5.2V7.8Q20.5 9 19.3 9H4.7Q3.5 9 3.5 7.8V5.2Q3.5 4 4.7 4Z" fill="url(#ecui-archive-dark-motion-accent)"/>
