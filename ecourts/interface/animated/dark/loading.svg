<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Working" class="ecui-loading-dark-motion">
<title>Working</title>
<desc>Three short bars advance in sequence; use only while work is active.</desc>
<defs><linearGradient id="ecui-loading-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-loading-dark-motion .p0{transform-box:view-box;transform-origin:12px 12px;animation:ecui-loading-dark-motion-p0 1200ms cubic-bezier(.3,0,.2,1) infinite backwards}@keyframes ecui-loading-dark-motion-p0{0%{transform:scaleY(1)}0%{transform:scaleY(1)}17%{transform:scaleY(0.4)}36%{transform:scaleY(1)}100%{transform:scaleY(1)}}.ecui-loading-dark-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-loading-dark-motion-p1 1200ms cubic-bezier(.3,0,.2,1) infinite backwards}@keyframes ecui-loading-dark-motion-p1{0%{transform:scaleY(1)}16%{transform:scaleY(1)}33%{transform:scaleY(0.4)}52%{transform:scaleY(1)}100%{transform:scaleY(1)}}.ecui-loading-dark-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-loading-dark-motion-p2 1200ms cubic-bezier(.3,0,.2,1) infinite backwards}@keyframes ecui-loading-dark-motion-p2{0%{transform:scaleY(1)}32%{transform:scaleY(1)}49%{transform:scaleY(0.4)}68%{transform:scaleY(1)}100%{transform:scaleY(1)}}}</style>
<path class="p0" d="M6 16V8" fill="none" stroke="url(#ecui-loading-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path class="p1" d="M12 16V8" fill="none" stroke="url(#ecui-loading-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
<path class="p2" d="M18 16V8" fill="none" stroke="url(#ecui-loading-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
