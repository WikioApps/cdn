<path class="p1" d="M9.5 8H14.5Q16 8 16 9.5V14.5Q16 16 14.5 16H9.5Q8 16 8 14.5V9.5Q8 8 9.5 8Z" fill="url(#ecui-stop-dark-motion-accent)"/>
</svg>
