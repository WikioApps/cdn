<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Tabbed notebook" class="ecui-notebook-tabs-dark-motion">
<title>Tabbed notebook</title>
<desc>The current tab pulls outward from the notebook edge.</desc>
<defs><linearGradient id="ecui-notebook-tabs-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-notebook-tabs-dark-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-notebook-tabs-dark-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-notebook-tabs-dark-motion-p2{0%{transform:translateX(-1.2px)}26%{transform:translateX(-0.6px)}58%{transform:translateX(0.1px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
<path class="p0" d="M6 3.5H16Q17.5 3.5 17.5 5V19Q17.5 20.5 16 20.5H6Q4.5 20.5 4.5 19V5Q4.5 3.5 6 3.5Z" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p1" d="M8 4V20M17.5 5H20V9H17.5M17.5 15H20V19H17.5" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p2" d="M17.5 10H21V14H17.5Z" fill="url(#ecui-notebook-tabs-dark-motion-accent)"/>
</svg>
