<path class="p1" d="M9 10.5H15Q16 10.5 16 11.5V12.5Q16 13.5 15 13.5H9Q8 13.5 8 12.5V11.5Q8 10.5 9 10.5Z" fill="url(#ecui-dumbbell-dark-motion-accent)"/>
</svg>
