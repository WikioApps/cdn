<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Folder" class="ecui-folder-dark-motion">
<title>Folder</title>
<desc>The front flap opens slightly, exposing the filing edge.</desc>
<defs><linearGradient id="ecui-folder-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-folder-dark-motion .p1{transform-box:view-box;transform-origin:12px 20px;animation:ecui-folder-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-folder-dark-motion-p1{0%{transform:scaleY(0.76)}26%{transform:scaleY(0.82)}58%{transform:scaleY(1.015)}82%{transform:scaleY(1)}100%{transform:scaleY(1)}}}</style>
