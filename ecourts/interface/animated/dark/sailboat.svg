<path class="p1" d="M10 5L3.5 15H10Z" fill="url(#ecui-sailboat-dark-motion-accent)"/>
<path class="p2" d="M14 7L20 15H14Z" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
</svg>
