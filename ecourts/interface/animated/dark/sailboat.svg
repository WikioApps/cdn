<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Sailboat" class="ecui-sailboat-dark-motion">
<title>Sailboat</title>
<desc>The sail opens from the mast.</desc>
<defs><linearGradient id="ecui-sailboat-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-sailboat-dark-motion .p1{transform-box:view-box;transform-origin:10px 15px;animation:ecui-sailboat-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-sailboat-dark-motion-p1{0%{transform:scaleX(0.68)}26%{transform:scaleX(0.75)}58%{transform:scaleX(1.02)}82%{transform:scaleX(1)}100%{transform:scaleX(1)}}}</style>
