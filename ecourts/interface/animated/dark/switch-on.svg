<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Switch on" class="ecui-switch-on-dark-motion">
<title>Switch on</title>
<desc>The thumb travels to its resting state without moving the track.</desc>
<defs><linearGradient id="ecui-switch-on-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-switch-on-dark-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-switch-on-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-switch-on-dark-motion-p1{0%{transform:translateX(-5px)}26%{transform:translateX(-2.5px)}58%{transform:translateX(0.1px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
<path class="p0" d="M8 6.5H16Q21.5 6.5 21.5 12V12Q21.5 17.5 16 17.5H8Q2.5 17.5 2.5 12V12Q2.5 6.5 8 6.5Z" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p1" d="M12.5 12a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0Z" fill="url(#ecui-switch-on-dark-motion-accent)"/>
</svg>
