<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Radio" class="ecui-radio-dark-motion">
<title>Radio</title>
<desc>The tuning needle moves to its station.</desc>
<defs><linearGradient id="ecui-radio-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-radio-dark-motion .p3{transform-box:view-box;transform-origin:12px 12px;animation:ecui-radio-dark-motion-p3 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-radio-dark-motion-p3{0%{transform:translateX(-1.5px)}26%{transform:translateX(-0.8px)}58%{transform:translateX(0.1px)}82%{transform:translateX(0px)}100%{transform:translateX(0px)}}}</style>
<path class="p0" d="M5 7L18 2M4 7H20V20H4Z" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p1" d="M6 14a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p2" d="M14 11H17M14 17H17" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p3" d="M15.5 10V12" fill="none" stroke="url(#ecui-radio-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
