<path class="p1" d="M7.8 13H16.2Q17 13 17 13.8V20.2Q17 21 16.2 21H7.8Q7 21 7 20.2V13.8Q7 13 7.8 13Z" fill="url(#ecui-print-dark-motion-accent)"/>
<path class="p2" d="M9.5 16H14.5" fill="none" stroke="#352026" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-surface,#352026)"/>
</svg>
