<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Print" class="ecui-print-dark-motion">
<title>Print</title>
<desc>The printed page advances from the fixed printer.</desc>
<defs><linearGradient id="ecui-print-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-print-dark-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-print-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-print-dark-motion-p1{0%{transform:translateY(-2px)}26%{transform:translateY(-0.9px)}58%{transform:translateY(0.1px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
