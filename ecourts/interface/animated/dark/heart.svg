<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Heart" class="ecui-heart-dark-motion">
<title>Heart</title>
<desc>The heart completes its contour once.</desc>
<defs><linearGradient id="ecui-heart-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-heart-dark-motion .p1{stroke-dasharray:1;stroke-dashoffset:0;transform-box:view-box;transform-origin:12px 12px;animation:ecui-heart-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-heart-dark-motion-p1{0%{stroke-dashoffset:1}15%{stroke-dashoffset:1}80%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}}</style>
<path class="p0" d="M12 20Q3.5 14 3.5 8.5Q3.5 4 7.5 4Q10.5 4 12 7Q13.5 4 16.5 4Q20.5 4 20.5 8.5Q20.5 14 12 20Z" fill="#FFAC8A" opacity="0.12" style="fill:var(--ec-icon-soft,#FFAC8A)"/>
<path class="p1" d="M12 20Q3.5 14 3.5 8.5Q3.5 4 7.5 4Q10.5 4 12 7Q13.5 4 16.5 4Q20.5 4 20.5 8.5Q20.5 14 12 20Z" fill="none" stroke="url(#ecui-heart-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
</svg>
