<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Key" class="ecui-key-dark-motion">
<title>Key</title>
<desc>The key tooth turns into alignment with the shaft.</desc>
<defs><linearGradient id="ecui-key-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-key-dark-motion .p1{transform-box:view-box;transform-origin:10.5px 11px;animation:ecui-key-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-key-dark-motion-p1{0%{transform:rotate(-12deg)}26%{transform:rotate(-6deg)}58%{transform:rotate(2deg)}82%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}}</style>
