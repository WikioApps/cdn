<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Footprints" class="ecui-footprints-dark-motion">
<title>Footprints</title>
<desc>One footprint follows the other by a small step.</desc>
<defs><linearGradient id="ecui-footprints-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-footprints-dark-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-footprints-dark-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-footprints-dark-motion-p2{0%{transform:translateY(-1.5px)}26%{transform:translateY(-1.2px)}58%{transform:translateY(0.2px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}.ecui-footprints-dark-motion .p3{transform-box:view-box;transform-origin:12px 12px;animation:ecui-footprints-dark-motion-p3 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-footprints-dark-motion-p3{0%{transform:translateY(-1.5px)}26%{transform:translateY(-1.2px)}58%{transform:translateY(0.2px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M5 3.5Q8 2.5 8 6V12H4.5V8Q3 6 5 3.5Z" fill="url(#ecui-footprints-dark-motion-accent)"/>
<path class="p1" d="M4.5 15H8V18Q6 20 4.5 18Z" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p2" d="M16 7.5Q19 6.5 19 10V16H15.5V12Q14 10 16 7.5Z" fill="url(#ecui-footprints-dark-motion-accent)"/>
<path class="p3" d="M15.5 19H19V20Q17 22 15.5 20Z" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
</svg>
