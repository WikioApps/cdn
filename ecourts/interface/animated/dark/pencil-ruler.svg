<style>@media(prefers-reduced-motion:no-preference){.ecui-pencil-ruler-dark-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-pencil-ruler-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-pencil-ruler-dark-motion-p1{0%{transform:translateX(-1.3px)}26%{transform:translateX(-0.8px)}58%{transform:translateX(0.7px)}82%{transform:translateX(0.15px)}100%{transform:translateX(0px)}}}</style>
