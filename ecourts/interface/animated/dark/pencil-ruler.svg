<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Drafting" class="ecui-pencil-ruler-dark-motion">
<title>Drafting</title>
<desc>The pencil makes a short drafting pass beside the fixed ruler.</desc>
