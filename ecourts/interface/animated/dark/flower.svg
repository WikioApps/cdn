<style>@media(prefers-reduced-motion:no-preference){.ecui-flower-dark-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-flower-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-flower-dark-motion-p1{0%{transform:scaleX(0.78)}26%{transform:scaleX(0.9)}58%{transform:scaleX(1.035)}82%{transform:scaleX(1)}100%{transform:scaleX(1)}}}</style>
