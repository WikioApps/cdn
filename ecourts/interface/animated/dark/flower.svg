<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Flower" class="ecui-flower-dark-motion">
<title>Flower</title>
<desc>Four petals open around a fixed centre.</desc>
