<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Goal" class="ecui-goal-dark-motion">
<title>Goal</title>
<desc>The ball seats at the target line.</desc>
<defs><linearGradient id="ecui-goal-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-goal-dark-motion .p1{transform-box:view-box;transform-origin:12px 12px;animation:ecui-goal-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-goal-dark-motion-p1{0%{transform:translateY(-2px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.1px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M3 21V4H21V21M3 4L7 8H17L21 4M7 8V17M17 8V17M7 12H17" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p1" d="M9.5 18.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z" fill="url(#ecui-goal-dark-motion-accent)"/>
</svg>
