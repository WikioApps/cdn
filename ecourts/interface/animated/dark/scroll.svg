<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Legal scroll" class="ecui-scroll-dark-motion">
<title>Legal scroll</title>
<desc>The written rule is revealed down the parchment.</desc>
