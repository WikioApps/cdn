<path class="p1" d="M7 11L11 7L15 9L20 4" fill="none" stroke="url(#ecui-chart-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
</svg>
