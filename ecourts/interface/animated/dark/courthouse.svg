<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Court" class="ecui-courthouse-dark-motion">
<title>Court</title>
<desc>Two structural piers seat beneath a fixed roof.</desc>
<defs><linearGradient id="ecui-courthouse-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-courthouse-dark-motion .p2{transform-box:view-box;transform-origin:12px 12px;animation:ecui-courthouse-dark-motion-p2 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-courthouse-dark-motion-p2{0%{transform:translateY(-2.1px)}26%{transform:translateY(-0.7px)}58%{transform:translateY(0.18px)}82%{transform:translateY(0px)}100%{transform:translateY(0px)}}.ecui-courthouse-dark-motion .p3{transform-box:view-box;transform-origin:12px 12px;animation:ecui-courthouse-dark-motion-p3 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-courthouse-dark-motion-p3{0%{transform:translateY(-2.1px)}26%{transform:translateY(-2.1px)}58%{transform:translateY(-0.4px)}82%{transform:translateY(0.12px)}100%{transform:translateY(0px)}}.ecui-courthouse-dark-motion .p4{transform-box:view-box;transform-origin:12px 12px;animation:ecui-courthouse-dark-motion-p4 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-courthouse-dark-motion-p4{0%{transform:translateY(-2.1px)}26%{transform:translateY(-2.1px)}58%{transform:translateY(-1.2px)}82%{transform:translateY(0.12px)}100%{transform:translateY(0px)}}}</style>
<path class="p0" d="M3.5 7.5L12 3.8L20.5 7.5L19.7 9H4.3Z" fill="url(#ecui-courthouse-dark-motion-accent)"/>
<path class="p1" d="M3.5 20.2H20.5M5 17.7H19" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p2" d="M7.2 11.7V15.5" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p3" d="M12 11.7V15.5" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p4" d="M16.8 11.7V15.5" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
