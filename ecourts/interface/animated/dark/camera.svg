<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Camera" class="ecui-camera-dark-motion">
<title>Camera</title>
<desc>The aperture closes slightly and reopens.</desc>
<defs><linearGradient id="ecui-camera-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-camera-dark-motion .p1{transform-box:view-box;transform-origin:12px 13.5px;animation:ecui-camera-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-camera-dark-motion-p1{0%{transform:scaleX(1)}26%{transform:scaleX(0.7)}58%{transform:scaleX(0.85)}82%{transform:scaleX(1)}100%{transform:scaleX(1)}}}</style>
<path class="p0" d="M3 8H7L9 4H15L17 8H21V20H3Z" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p1" d="M8 13.5a4 4 0 1 0 8 0a4 4 0 1 0 -8 0Z" fill="none" stroke="url(#ecui-camera-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
