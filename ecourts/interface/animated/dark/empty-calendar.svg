<path class="p1" d="M4 9H20M8 3V6M16 3V6" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p2" d="M9 14.5H15" fill="none" stroke="url(#ecui-empty-calendar-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
