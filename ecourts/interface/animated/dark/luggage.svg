<path class="p1" d="M8 20V22M16 20V22M9 11V16M15 11V16" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p2" d="M9 7V3H15V7" fill="none" stroke="url(#ecui-luggage-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
