<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Sort" class="ecui-sort-dark-motion">
<title>Sort</title>
<desc>The ordered rows resolve from longest to shortest.</desc>
<defs><linearGradient id="ecui-sort-dark-motion-accent" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="22"><stop stop-color="#FFD1A6" style="stop-color:var(--ec-icon-accent,#FFD1A6)"/><stop offset="1" stop-color="#FF9271" style="stop-color:var(--ec-icon-accent-end,#FF9271)"/></linearGradient></defs>
<style>@media(prefers-reduced-motion:no-preference){.ecui-sort-dark-motion .p0{stroke-dasharray:1;stroke-dashoffset:0;transform-box:view-box;transform-origin:12px 12px;animation:ecui-sort-dark-motion-p0 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-sort-dark-motion-p0{0%{stroke-dashoffset:1}15%{stroke-dashoffset:1}80%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}}</style>
<path class="p0" d="M4 6H15M4 12H12M4 18H9" fill="none" stroke="#F7E9E2" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke:var(--ec-icon-ink,#F7E9E2)"/>
<path class="p1" d="M19 5V19M16 16L19 19L22 16" fill="none" stroke="url(#ecui-sort-dark-motion-accent)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
