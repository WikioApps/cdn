<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Video" class="ecui-video-dark-motion">
<title>Video</title>
<desc>The lens aperture opens beside the body.</desc>
