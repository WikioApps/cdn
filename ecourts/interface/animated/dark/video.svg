<style>@media(prefers-reduced-motion:no-preference){.ecui-video-dark-motion .p1{transform-box:view-box;transform-origin:15px 12px;animation:ecui-video-dark-motion-p1 800ms cubic-bezier(.3,0,.2,1) 1 backwards}@keyframes ecui-video-dark-motion-p1{0%{transform:scaleX(0.68)}26%{transform:scaleX(0.75)}58%{transform:scaleX(1.02)}82%{transform:scaleX(1)}100%{transform:scaleX(1)}}}</style>
