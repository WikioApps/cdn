<linearGradient id="03-folio-light-reflection" gradientUnits="userSpaceOnUse" x1="200" y1="175" x2="860" y2="900"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.47" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.13"/><stop offset="0.54" stop-color="#FFFFFF" stop-opacity="0.035"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
