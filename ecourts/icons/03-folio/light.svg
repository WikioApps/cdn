<title id="03-folio-light-title">eCourts — Folio — light</title>
<desc id="03-folio-light-description">Full-bleed light app icon. An open record expressed as two folded planes. Independently editable silhouette, colour and surface layers. Original native vector artwork without raster images, fonts or external resources.</desc>
