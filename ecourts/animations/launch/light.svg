<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="ecourts-launch-light-title ecourts-launch-light-description">
  <title id="ecourts-launch-light-title">eCourts launch — light</title>
  <desc id="ecourts-launch-light-description">Transparent courthouse mark. A single 840 ms critically damped settle. Reduced motion shows the complete, still mark.</desc>
  <defs>
